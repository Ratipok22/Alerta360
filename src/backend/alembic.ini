[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url se deja vacio a proposito: alembic/env.py lo arma desde
# la variable de entorno DATABASE_URL (la misma que usa core/db.py), para
# no duplicar ni desincronizar la credencial en dos archivos distintos.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
