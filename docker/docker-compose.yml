services:
  db:
    image: postgres:16
    # Credenciales en .env (no versionado, ver .env.example en esta misma
    # carpeta) -- nunca escritas directo aca, porque este repo es publico.
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # El servicio "db" ya leia .env, pero a este servicio nunca le llegaban
    # esas mismas variables (POSTGRES_DB/USER/PASSWORD) -- sin env_file aca,
    # el backend no tenia forma de construir la URL de conexion a Postgres.
    env_file:
      - .env
    environment:
      OSRM_URL: http://osrm:5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - osrm
  # Motor de rutas real (OSRM, 100% local) sobre calles reales de la Region
  # de Valparaiso -- ver routing/README.md para como se generaron los datos.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/valparaiso.osrm
    volumes:
      - ./routing/data:/data
    ports:
      - "5001:5000"
volumes:
  postgres_data:
