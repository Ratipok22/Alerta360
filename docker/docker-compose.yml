services:
  db:
    image: postgres:16
    # Credenciales en .env (no versionado, ver .env.example en esta misma
    # carpeta) -- nunca escritas directo aca, porque este repo es publico.
    env_file:
      - .env
    environment:
      # Sin esto, CURRENT_TIMESTAMP/now() en Postgres usa UTC por defecto
      # -- las columnas de fecha son "timestamp without time zone" (hora
      # "ingenua", sin offset), y el frontend las muestra tal cual llegan
      # (new Date(...).toLocaleString()), asumiendo que ya es hora de
      # Chile. Fijando la zona del contenedor se evita ese desfase sin
      # tener que tocar el esquema de la base de datos.
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      OSRM_URL: http://osrm:5000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - osrm
  # Motor de rutas real (OSRM, 100% local) sobre calles reales de la Region
  # de Valparaiso -- ver routing/README.md para como se generaron los datos.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/valparaiso.osrm
    volumes:
      - ./routing/data:/data
    ports:
      - "5001:5000"
volumes:
  postgres_data:
