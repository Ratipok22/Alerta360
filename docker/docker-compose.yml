services:
  db:
    image: postgres:16
    # Credenciales en .env (no versionado, ver .env.example en esta misma
    # carpeta) -- nunca escritas directo aca, porque este repo es publico.
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
