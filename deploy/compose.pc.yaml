services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: ./api.env
    environment:
      APP_ENV: production
      CORS_ORIGINS: https://alerta360-zeta.vercel.app
      OSRM_URL: http://osrm:5000
      MODEL_PATH: /model/demand_model.joblib
      HISTORIAL_PATH: /state/historial_acciones.json
      TZ: America/Santiago
    volumes:
      - ../src/backend/ml/artifacts:/model:ro
      - historial_pc:/state
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
  osrm:
    image: fruna/osrm-valparaiso:valparaiso-v1
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api:8000
    restart: unless-stopped
    profiles: ["publico"]
    depends_on:
      api:
        condition: service_healthy
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles: ["ngrok"]
    env_file: ./ngrok.env
    command: ["http", "--url=https://feminine-rope-sheath.ngrok-free.dev", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  historial_pc:
